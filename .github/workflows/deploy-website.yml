# Builds the documentation website (website/) and publishes it to GitHub Pages.
#
# The site's docs are generated from the app's Help section
# (frontend/src/components/help), so changes to the help articles also
# trigger a deploy.
#
# One-time setup: in the repository settings, under Pages, set
# "Build and deployment > Source" to "GitHub Actions".
#
# Every job takes its Node version from .nvmrc, so the pipelines, the website
# build and a local `nvm use` all run the same release. Keep .nvmrc on a Node
# LTS line that satisfies "engines" in package.json; .npmrc sets engine-strict,
# so an end-of-life or too-old release fails `npm ci` outright.

name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'frontend/src/components/help/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Build site
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
