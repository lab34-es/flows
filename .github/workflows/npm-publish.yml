# Publishes @lab34/flows to npm when a version tag (v1.2.3) is pushed, or a
# release is created for one.
#
# The same gates a pull request has to clear are re-run here, against the exact
# commit being released: a release must not ship code that is untested, below
# the coverage threshold, or carrying a critical advisory. The tag has to
# match the version in package.json, and a version npm already has is skipped
# rather than failed — so a tag push followed by a release created from that
# tag publishes once, not twice.
#
# Every job takes its Node version from .nvmrc, so the pipelines, the website
# build and a local `nvm use` all run the same release. Keep .nvmrc on a Node
# LTS line that satisfies "engines" in package.json; .npmrc sets engine-strict,
# so an end-of-life or too-old release fails `npm ci` outright.

name: Node.js Package

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        # Enforces the 80% threshold from jest.config.js.
        run: npm run test:coverage

      - name: Audit (root)
        run: npm audit --audit-level=critical

      - name: Audit (frontend)
        run: npm audit --audit-level=critical --prefix frontend

      # The UI ships inside the package, so it has to be built before the
      # package: copy-assets folds frontend/dist into dist/frontend, and skips
      # it with a warning when it is not there yet.
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build the frontend
        run: npm run build:frontend

      - name: Build
        run: npm run build

      - name: Check the UI was bundled into the package
        run: test -f dist/frontend/index.html

      - name: Check the CLI starts from the compiled output
        run: node dist/cli.js --help

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    # Trusted publishing: npm trades this short-lived OIDC token for a
    # publish credential, so there is no long-lived NPM_TOKEN to expire,
    # rotate or leak. The trusted publisher configured on npmjs.com names
    # this repository and this workflow file; if either moves, update it
    # there or the exchange is refused.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Deliberately no registry-url: it makes setup-node write an
      # _authToken line into .npmrc, filled with a placeholder when no token
      # is supplied. npm falls back to that placeholder whenever the OIDC
      # exchange fails, so the job would publish a bogus credential and
      # report a confusing 404. The default registry is npmjs.org anyway.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # OIDC publishing needs npm 11.5.1 or newer; without it npm never
      # attempts the exchange and fails looking for a token with ENEEDAUTH.
      # Node 24 already bundles an npm well past that, so this is belt and
      # braces: it keeps the job on the newest npm regardless of what the
      # runner ships.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag names the version it releases: v<package.json version>, nothing
      # else. A mismatched tag is a mistake worth stopping.
      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      # Both triggers can fire for the same version (tag push, then a release
      # created from the tag): publish only when npm does not have it yet.
      - name: Check whether this version is already on npm
        id: on_npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@lab34/flows@$VERSION" version --loglevel=error >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@lab34/flows@$VERSION is already on npm; skipping the publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly builds the frontend as well, so its dependencies have to
      # be installed here too or the publish dies on a missing vite.
      - if: steps.on_npm.outputs.published == 'false'
        run: npm ci --prefix frontend

      # prepublishOnly builds the UI and compiles src/ into dist/, which is what
      # "files" ships.
      # Publishing over OIDC also attaches provenance to the release.
      # If this ever fails, re-run with --loglevel=verbose: npm reports a
      # failed token exchange only at verbose level and otherwise falls
      # through to a bare ENEEDAUTH.
      - if: steps.on_npm.outputs.published == 'false'
        run: npm publish --access=public
